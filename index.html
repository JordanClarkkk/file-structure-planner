<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Structure Planner</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0b10;
      color: #c9d1d9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #0d1017;
      border-right: 1px solid #1b1f2a;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
    }

    .sidebar .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0 0.25rem;
    }

    .sidebar .logo svg {
      width: 28px;
      height: 28px;
      color: #7c5bf2;
    }

    .sidebar .logo h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: -0.02em;
    }

    .sidebar .logo span {
      font-size: 0.7rem;
      font-weight: 500;
      color: #7c5bf2;
      background: #7c5bf215;
      border: 1px solid #7c5bf230;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .sidebar-section h3 {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #484f58;
      padding: 0 0.5rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.65rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #b0b8c1;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .sidebar-btn:hover {
      background: #161b26;
      color: #e1e4e8;
    }

    .sidebar-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-btn.accent { color: #7c5bf2; }
    .sidebar-btn.accent:hover { background: #7c5bf212; }
    .sidebar-btn.danger { color: #e5534b; }
    .sidebar-btn.danger:hover { background: #e5534b12; }

    .sidebar-divider {
      height: 1px;
      background: #1b1f2a;
      margin: 0.25rem 0;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 0 0.25rem;
      font-size: 0.7rem;
      color: #333940;
    }

    /* ── Main Area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.75rem;
      border-bottom: 1px solid #1b1f2a;
      background: #0d101780;
      backdrop-filter: blur(12px);
    }

    .breadcrumb {
      font-size: 0.8rem;
      color: #484f58;
    }

    .breadcrumb strong { color: #c9d1d9; font-weight: 600; }

    .main-header .stats {
      display: flex;
      gap: 1.25rem;
      font-size: 0.75rem;
      color: #484f58;
    }

    .main-header .stat-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .main-header .stat-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .main-header .dot-folder { background: #d4943a; }
    .main-header .dot-file { background: #6b9fed; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.75rem;
    }

    /* ── Tree ── */
    .tree-node {
      position: relative;
    }

    .tree-node-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      transition: background 0.08s;
      cursor: default;
    }

    .tree-node-row:hover { background: #151a25; }

    .tree-node-row.selected { background: #7c5bf212; }

    .chevron-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: none;
      color: #3d4450;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
      transition: all 0.12s;
    }

    .chevron-btn:hover { background: #1e2530; color: #c9d1d9; }

    .chevron-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.15s ease;
    }

    .chevron-btn.open svg { transform: rotate(90deg); }
    .chevron-btn.placeholder { visibility: hidden; }

    .node-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-icon svg { width: 16px; height: 16px; }
    .node-icon.folder svg { color: #d4943a; }
    .node-icon.file svg { color: #6b9fed; }

    .node-name-input {
      background: none;
      border: 1px solid transparent;
      color: #e1e4e8;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      outline: none;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 80px;
      max-width: 200px;
    }

    .node-name-input:focus {
      background: #0a0b10;
      border-color: #7c5bf255;
    }

    .node-desc-input {
      background: none;
      border: 1px solid transparent;
      color: #4d5563;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-style: italic;
      outline: none;
      padding: 2px 6px;
      border-radius: 4px;
      flex: 1;
      min-width: 60px;
    }

    .node-desc-input::placeholder { color: #272c37; }

    .node-desc-input:focus {
      background: #0a0b10;
      border-color: #7c5bf233;
      color: #8b949e;
    }

    .node-actions {
      display: flex;
      gap: 1px;
      opacity: 0;
      transition: opacity 0.12s;
      margin-left: auto;
    }

    .tree-node-row:hover .node-actions { opacity: 1; }

    .node-action-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #484f58;
      transition: all 0.1s;
    }

    .node-action-btn svg { width: 14px; height: 14px; }
    .node-action-btn:hover { background: #1e2530; color: #c9d1d9; }
    .node-action-btn.delete:hover { background: #e5534b18; color: #e5534b; }

    .tree-children {
      margin-left: 11px;
      padding-left: 16px;
      border-left: 1px solid #1b1f2a;
    }

    .tree-children.collapsed { display: none; }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1rem;
      color: #2d333b;
    }

    .empty-state svg { width: 56px; height: 56px; color: #1b1f2a; }

    .empty-state p {
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
    }

    .empty-state p strong { color: #484f58; }

    .empty-state-btn {
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #7c5bf244;
      background: #7c5bf210;
      color: #9b82f6;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .empty-state-btn:hover {
      background: #7c5bf220;
      border-color: #7c5bf266;
    }

    .empty-state-btn svg { width: 16px; height: 16px; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #13161f;
      border: 1px solid #1e2330;
      border-radius: 14px;
      padding: 1.5rem;
      width: 90%;
      max-width: 640px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } }

    .modal-box h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .modal-box pre {
      background: #0a0b10;
      border: 1px solid #1b1f2a;
      border-radius: 8px;
      padding: 1.25rem;
      font-size: 0.78rem;
      line-height: 1.7;
      overflow: auto;
      flex: 1;
      color: #8b949e;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    .modal-footer {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: flex-end;
    }

    .modal-footer button {
      padding: 0.5rem 1rem;
      border-radius: 7px;
      border: 1px solid #1e2330;
      background: #161b26;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.12s;
    }

    .modal-footer button:hover { background: #1e2530; }

    .modal-footer .btn-primary {
      background: #7c5bf2;
      border-color: #7c5bf2;
      color: #fff;
    }

    .modal-footer .btn-primary:hover { background: #6d4de0; }

    /* ── Preview Panel ── */
    .preview-panel {
      width: 320px;
      min-width: 320px;
      background: #0d1017;
      border-left: 1px solid #1b1f2a;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .preview-panel h3 {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #484f58;
      margin-bottom: 1rem;
    }

    .preview-tree {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.75rem;
      line-height: 1.8;
      color: #6b7280;
      white-space: pre;
    }

    .preview-tree .pf { color: #d4943a; }
    .preview-tree .fi { color: #6b9fed; }

    .preview-empty {
      color: #272c37;
      font-size: 0.8rem;
      text-align: center;
      padding: 2rem 0;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1b1f2a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d333b; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

// ── Icons (inline SVGs) ──
const Icons = {
  folder: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
  folderPlus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>,
  file: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  filePlus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>,
  chevron: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
  copy: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
  export: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  eraser: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20H7L3 16l9-9 8 8-4 4"/><line x1="6" y1="11" x2="13" y2="18"/></svg>,
  layers: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
  plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
};

// ── Helpers ──
let _id = 0;
const uid = () => ++_id;

const makeNode = (type, name) => ({
  id: uid(),
  type,
  name: name || (type === 'folder' ? 'new-folder' : 'new-file'),
  description: '',
  children: type === 'folder' ? [] : null,
  collapsed: false,
});

// Sort: folders first, then files, each group alphabetical
const sortChildren = (children) => {
  if (!children) return children;
  return [...children].sort((a, b) => {
    if (a.type === 'folder' && b.type !== 'folder') return -1;
    if (a.type !== 'folder' && b.type === 'folder') return 1;
    return a.name.localeCompare(b.name);
  });
};

// Deep clone + sort
const sortTree = (nodes) =>
  sortChildren(nodes).map((n) => ({
    ...n,
    children: n.children ? sortTree(n.children) : null,
  }));

// Count
const countNodes = (nodes) => {
  let folders = 0, files = 0;
  const walk = (list) => {
    for (const n of list) {
      if (n.type === 'folder') { folders++; if (n.children) walk(n.children); }
      else files++;
    }
  };
  walk(nodes);
  return { folders, files };
};

// Export as ASCII tree
const buildExport = (nodes, prefix = '') => {
  let lines = [];
  const sorted = sortChildren(nodes);
  sorted.forEach((node, i) => {
    const isLast = i === sorted.length - 1;
    const connector = isLast ? '└── ' : '├── ';
    const desc = node.description ? `  — ${node.description}` : '';
    const suffix = node.type === 'folder' ? '/' : '';
    lines.push(prefix + connector + node.name + suffix + desc);
    if (node.children && node.children.length > 0) {
      const childPrefix = prefix + (isLast ? '    ' : '│   ');
      lines = lines.concat(buildExport(node.children, childPrefix));
    }
  });
  return lines;
};

// ── Tree Node Component ──
function TreeNode({ node, onUpdate, onDelete, onAddChild, focusId }) {
  const isFolder = node.type === 'folder';
  const nameRef = useRef(null);

  useEffect(() => {
    if (focusId === node.id && nameRef.current) {
      nameRef.current.focus();
      nameRef.current.select();
    }
  }, [focusId, node.id]);

  const sorted = isFolder ? sortChildren(node.children) : [];

  return (
    <div className="tree-node">
      <div className="tree-node-row">
        {isFolder ? (
          <button
            className={`chevron-btn ${node.collapsed ? '' : 'open'}`}
            onClick={() => onUpdate(node.id, { collapsed: !node.collapsed })}
          >
            {Icons.chevron}
          </button>
        ) : (
          <span className="chevron-btn placeholder" />
        )}

        <span className={`node-icon ${isFolder ? 'folder' : 'file'}`}>
          {isFolder ? Icons.folder : Icons.file}
        </span>

        <input
          ref={nameRef}
          className="node-name-input"
          value={node.name}
          placeholder={isFolder ? 'folder-name' : 'file-name'}
          spellCheck={false}
          onChange={(e) => onUpdate(node.id, { name: e.target.value })}
          size={Math.max(node.name.length, 8)}
        />

        <input
          className="node-desc-input"
          value={node.description}
          placeholder="add description..."
          spellCheck={false}
          onChange={(e) => onUpdate(node.id, { description: e.target.value })}
        />

        <div className="node-actions">
          {isFolder && (
            <>
              <button className="node-action-btn" title="Add subfolder" onClick={() => onAddChild(node.id, 'folder')}>
                {Icons.folderPlus}
              </button>
              <button className="node-action-btn" title="Add file" onClick={() => onAddChild(node.id, 'file')}>
                {Icons.filePlus}
              </button>
            </>
          )}
          <button className="node-action-btn delete" title="Delete" onClick={() => onDelete(node.id)}>
            {Icons.trash}
          </button>
        </div>
      </div>

      {isFolder && (
        <div className={`tree-children${node.collapsed ? ' collapsed' : ''}`}>
          {sorted.map((child) => (
            <TreeNode
              key={child.id}
              node={child}
              onUpdate={onUpdate}
              onDelete={onDelete}
              onAddChild={onAddChild}
              focusId={focusId}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// ── Live Preview (right panel) ──
function LivePreview({ tree }) {
  if (tree.length === 0) return <p className="preview-empty">Your structure will appear here</p>;

  const lines = buildExport(tree, '');
  return (
    <div className="preview-tree">
      {lines.map((line, i) => {
        const isFolder = line.includes('/') && !line.includes('.');
        return <div key={i}>{line}</div>;
      })}
    </div>
  );
}

// ── App ──
function App() {
  const [tree, setTree] = useState([]);
  const [focusId, setFocusId] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [copyLabel, setCopyLabel] = useState('Copy');

  // Deep update helper
  const updateInTree = useCallback((nodes, id, patch) => {
    return nodes.map((n) => {
      if (n.id === id) return { ...n, ...patch };
      if (n.children) return { ...n, children: updateInTree(n.children, id, patch) };
      return n;
    });
  }, []);

  const deleteInTree = useCallback((nodes, id) => {
    return nodes.filter((n) => n.id !== id).map((n) => {
      if (n.children) return { ...n, children: deleteInTree(n.children, id) };
      return n;
    });
  }, []);

  const addChildInTree = useCallback((nodes, parentId, child) => {
    return nodes.map((n) => {
      if (n.id === parentId) {
        return { ...n, collapsed: false, children: [...(n.children || []), child] };
      }
      if (n.children) return { ...n, children: addChildInTree(n.children, parentId, child) };
      return n;
    });
  }, []);

  const handleUpdate = useCallback((id, patch) => {
    setTree((prev) => updateInTree(prev, id, patch));
  }, [updateInTree]);

  const handleDelete = useCallback((id) => {
    setTree((prev) => deleteInTree(prev, id));
  }, [deleteInTree]);

  const handleAddChild = useCallback((parentId, type) => {
    const child = makeNode(type);
    setTree((prev) => addChildInTree(prev, parentId, child));
    setFocusId(child.id);
  }, [addChildInTree]);

  const handleAddRoot = useCallback(() => {
    const node = makeNode('folder');
    setTree((prev) => [...prev, node]);
    setFocusId(node.id);
  }, []);

  const handleClear = useCallback(() => {
    if (tree.length === 0) return;
    if (confirm('Clear the entire structure?')) setTree([]);
  }, [tree]);

  const handleCopy = useCallback(() => {
    const text = buildExport(tree, '').join('\n');
    navigator.clipboard.writeText(text);
    setCopyLabel('Copied!');
    setTimeout(() => setCopyLabel('Copy'), 1500);
  }, [tree]);

  const { folders, files } = countNodes(tree);
  const sorted = sortTree(tree);

  return (
    <div className="app">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="logo">
          {Icons.layers}
          <div>
            <h1>Structure</h1>
          </div>
          <span>Planner</span>
        </div>

        <div className="sidebar-section">
          <h3>Create</h3>
          <button className="sidebar-btn accent" onClick={handleAddRoot}>
            {Icons.folderPlus}
            Add Root Folder
          </button>
        </div>

        <div className="sidebar-divider" />

        <div className="sidebar-section">
          <h3>Actions</h3>
          <button className="sidebar-btn" onClick={() => tree.length && setShowExport(true)}>
            {Icons.export}
            Export Structure
          </button>
          <button className="sidebar-btn danger" onClick={handleClear}>
            {Icons.eraser}
            Clear All
          </button>
        </div>

        <div className="sidebar-footer">
          Folders always appear above files
        </div>
      </div>

      {/* Main tree editor */}
      <div className="main">
        <div className="main-header">
          <div className="breadcrumb">
            <strong>Project</strong> / structure
          </div>
          <div className="stats">
            <span className="stat-item"><span className="dot dot-folder" /> {folders} folder{folders !== 1 ? 's' : ''}</span>
            <span className="stat-item"><span className="dot dot-file" /> {files} file{files !== 1 ? 's' : ''}</span>
          </div>
        </div>

        <div className="main-content">
          {sorted.length === 0 ? (
            <div className="empty-state">
              {Icons.layers}
              <p>Start planning your project structure.<br />Click the button below or use the sidebar.</p>
              <button className="empty-state-btn" onClick={handleAddRoot}>
                {Icons.plus}
                Add Your First Folder
              </button>
            </div>
          ) : (
            sorted.map((node) => (
              <TreeNode
                key={node.id}
                node={node}
                onUpdate={handleUpdate}
                onDelete={handleDelete}
                onAddChild={handleAddChild}
                focusId={focusId}
              />
            ))
          )}
        </div>
      </div>

      {/* Live preview panel */}
      <div className="preview-panel">
        <h3>Live Preview</h3>
        <LivePreview tree={sorted} />
      </div>

      {/* Export modal */}
      {showExport && (
        <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && setShowExport(false)}>
          <div className="modal-box">
            <h2>Exported Structure</h2>
            <pre>{buildExport(tree, '').join('\n')}</pre>
            <div className="modal-footer">
              <button onClick={() => setShowExport(false)}>Close</button>
              <button className="btn-primary" onClick={handleCopy}>
                {copyLabel}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
