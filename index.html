<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Structure Planner</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f6fa;
      color: #1a1d27;
      min-height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #fff;
      border-right: 1px solid #e2e5ed;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 0.75rem;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.5rem;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 18px; height: 18px; color: #fff; }
    .logo h1 { font-size: 0.95rem; font-weight: 700; color: #1a1d27; }

    .sidebar-label {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #9ca3b0; padding: 0 0.75rem;
    }

    .add-buttons { display: flex; flex-direction: column; gap: 0.5rem; padding: 0 0.25rem; }

    .add-btn {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1rem; border: 2px dashed #d5d9e2; border-radius: 12px;
      background: #fafbfc; cursor: pointer; transition: all 0.15s ease;
      font-family: inherit; font-size: 0.85rem; font-weight: 600; color: #555d6e;
    }
    .add-btn:hover { border-color: #6c5ce7; background: #f0edff; color: #6c5ce7; }

    .add-btn .btn-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .add-btn .btn-icon svg { width: 20px; height: 20px; }
    .add-btn.folder-btn .btn-icon { background: #fff3e0; color: #e67e22; }
    .add-btn.file-btn .btn-icon { background: #e3f2fd; color: #2196f3; }

    .sidebar-divider { height: 1px; background: #eef0f4; margin: 0.25rem 0.5rem; }

    .action-btn {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 0.75rem; border: none; border-radius: 8px;
      background: transparent; color: #6b7280; font-size: 0.8rem;
      font-family: inherit; font-weight: 500; cursor: pointer; transition: all 0.1s;
    }
    .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .action-btn:hover { background: #f0f1f5; color: #1a1d27; }
    .action-btn.danger:hover { background: #fef2f2; color: #ef4444; }

    .link-toggle {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.75rem; border: 2px solid #e2e5ed; border-radius: 10px;
      background: #fff; color: #6b7280; font-size: 0.8rem;
      font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.15s;
      margin: 0 0.25rem;
    }
    .link-toggle svg { width: 16px; height: 16px; }
    .link-toggle:hover { border-color: #a29bfe; background: #f8f7ff; }
    .link-toggle.active { border-color: #6c5ce7; background: #f0edff; color: #6c5ce7; }
    .link-toggle.waiting { border-color: #e67e22; background: #fff8f0; color: #e67e22; animation: pulse 1.2s ease infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .sidebar-footer {
      margin-top: auto; padding: 0 0.75rem;
      font-size: 0.65rem; color: #c0c4cc;
    }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1.5rem; background: #fff; border-bottom: 1px solid #e2e5ed;
    }
    .toolbar-bar .stats { display: flex; gap: 1rem; font-size: 0.75rem; color: #9ca3b0; font-weight: 500; }
    .stat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .stat-dot.folder { background: #e67e22; }
    .stat-dot.file { background: #2196f3; }
    .toolbar-bar .hint { font-size: 0.7rem; color: #c0c4cc; font-style: italic; }

    .canvas-area {
      flex: 1; overflow: auto; position: relative; padding: 1.5rem 2rem;
    }

    /* ── Visual Tree ── */
    .tree-node { position: relative; }

    .tree-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.6rem; border-radius: 10px; transition: background 0.1s;
      cursor: default; margin-bottom: 2px;
    }
    .tree-row:hover { background: #f0f1f5; }
    .tree-row.link-selectable { cursor: pointer; }
    .tree-row.link-selectable:hover { background: #f0edff; }
    .tree-row.link-selected { background: #ede6ff; outline: 2px solid #a29bfe; outline-offset: -1px; }

    /* Chevron */
    .chev-btn {
      width: 28px; height: 28px; border: none; background: none;
      color: #b0b6c0; cursor: pointer; display: flex;
      align-items: center; justify-content: center; border-radius: 6px;
      flex-shrink: 0; transition: all 0.12s;
    }
    .chev-btn:hover { background: #e8eaf0; color: #555; }
    .chev-btn svg { width: 16px; height: 16px; transition: transform 0.15s ease; }
    .chev-btn.open svg { transform: rotate(90deg); }
    .chev-placeholder { width: 28px; flex-shrink: 0; }

    /* Icon */
    .node-icon-box {
      width: 42px; height: 42px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 2px solid;
    }
    .node-icon-box svg { width: 22px; height: 22px; }
    .node-icon-box.folder { background: #fff8f0; border-color: #f0d9b5; color: #e67e22; }
    .node-icon-box.file { background: #f0f7ff; border-color: #b8d8f8; color: #2196f3; }

    /* Name input */
    .node-name {
      background: none; border: 2px solid transparent;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      color: #1a1d27; outline: none; padding: 4px 8px; border-radius: 6px;
      min-width: 100px; max-width: 240px;
    }
    .node-name:focus { background: #fff; border-color: #6c5ce744; }

    /* Desc input */
    .node-desc {
      background: none; border: 2px solid transparent;
      font-family: inherit; font-size: 0.78rem; color: #9ca3b0; font-style: italic;
      outline: none; padding: 4px 8px; border-radius: 6px; width: 180px;
    }
    .node-desc::placeholder { color: #d0d4db; }
    .node-desc:focus { background: #fff; border-color: #6c5ce722; color: #6b7280; }

    /* Row actions */
    .row-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; margin-left: auto; }
    .tree-row:hover .row-actions { opacity: 1; }

    .icon-btn {
      width: 32px; height: 32px; border: none; background: none; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #9ca3b0; transition: all 0.1s;
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { background: #e8eaf0; color: #1a1d27; }
    .icon-btn.add-folder:hover { background: #fff3e0; color: #e67e22; }
    .icon-btn.add-file:hover { background: #e3f2fd; color: #2196f3; }
    .icon-btn.delete:hover { background: #fef2f2; color: #ef4444; }

    /* Tree branch lines */
    .tree-children {
      position: relative;
      margin-left: 14px;
      padding-left: 28px;
    }

    /* vertical line */
    .tree-children::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 0;
      bottom: 12px;
      width: 2px;
      background: #e2e5ed;
      border-radius: 1px;
    }

    /* horizontal branches per child */
    .tree-children > .tree-node::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 23px;
      width: 14px;
      height: 2px;
      background: #e2e5ed;
    }

    .tree-children.collapsed { display: none; }

    /* ── Drop target highlight ── */
    .tree-row.drag-over {
      background: #f0edff;
      outline: 2px dashed #a29bfe;
      outline-offset: -1px;
    }

    /* ── Add row buttons (inside folder) ── */
    .add-child-row {
      display: flex; gap: 0.4rem; padding: 0.3rem 0 0.3rem 0; margin-left: 0;
    }

    .add-child-btn {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.75rem; border: 2px dashed #dde1ea; border-radius: 8px;
      background: transparent; cursor: pointer; transition: all 0.12s;
      font-family: inherit; font-size: 0.72rem; font-weight: 600; color: #b0b6c0;
    }
    .add-child-btn svg { width: 14px; height: 14px; }
    .add-child-btn:hover { border-color: #6c5ce7; background: #f8f7ff; color: #6c5ce7; }
    .add-child-btn.folder-add:hover { border-color: #e67e22; background: #fff8f0; color: #e67e22; }
    .add-child-btn.file-add:hover { border-color: #2196f3; background: #f0f7ff; color: #2196f3; }

    /* ── Connection lines (SVG overlay) ── */
    .connections-svg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    .conn-line {
      fill: none;
      stroke: #a29bfe;
      stroke-width: 2.5;
      stroke-dasharray: 8 5;
      filter: drop-shadow(0 1px 2px rgba(108,92,231,0.25));
    }

    .conn-dot {
      fill: #a29bfe;
      stroke: #fff;
      stroke-width: 2;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 1rem; color: #b0b6c0;
    }
    .empty-state .empty-icon {
      width: 80px; height: 80px; background: #f0f1f5; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-state .empty-icon svg { width: 36px; height: 36px; color: #d0d4db; }
    .empty-state p { font-size: 0.9rem; text-align: center; line-height: 1.6; }
    .empty-cta {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.4rem; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff; font-size: 0.9rem; font-family: inherit; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      box-shadow: 0 4px 14px rgba(108,92,231,0.3);
    }
    .empty-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,92,231,0.4); }
    .empty-cta svg { width: 18px; height: 18px; }

    /* ── Preview Panel ── */
    .preview-panel {
      width: 280px; min-width: 280px; background: #fff;
      border-left: 1px solid #e2e5ed; padding: 1.25rem;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .preview-panel h3 {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #9ca3b0; margin-bottom: 1rem;
    }
    .preview-tree {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.72rem; line-height: 1.9; color: #6b7280; white-space: pre;
    }
    .preview-empty { color: #d0d4db; font-size: 0.8rem; text-align: center; padding: 2rem 0; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px); display: flex; align-items: center;
      justify-content: center; z-index: 200; animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #fff; border: 1px solid #e2e5ed; border-radius: 16px;
      padding: 1.5rem; width: 90%; max-width: 640px; max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12); animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } }
    .modal-box h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .modal-box pre {
      background: #f8f9fb; border: 1px solid #e2e5ed; border-radius: 10px;
      padding: 1.25rem; font-size: 0.78rem; line-height: 1.7; overflow: auto;
      flex: 1; color: #555d6e;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    .modal-footer { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
    .modal-footer button {
      padding: 0.55rem 1.1rem; border-radius: 8px; border: 1px solid #e2e5ed;
      background: #fff; color: #555d6e; cursor: pointer; font-size: 0.82rem;
      font-family: inherit; font-weight: 600; transition: all 0.12s;
    }
    .modal-footer button:hover { background: #f0f1f5; }
    .modal-footer .btn-primary {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-color: transparent; color: #fff;
    }
    .modal-footer .btn-primary:hover { opacity: 0.9; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e5ed; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #d0d4db; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect, useMemo } = React;

/* ═══════ SVG ICONS ═══════ */
const I = {
  folder: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
  folderPlus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>,
  file: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  filePlus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
  chevron: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
  plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  layers: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
  exportIcon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  eraser: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20H7L3 16l9-9 8 8-4 4"/><line x1="6" y1="11" x2="13" y2="18"/></svg>,
  link: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>,
  x: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
};

/* ═══════ HELPERS ═══════ */
let _id = 0;
const uid = () => ++_id;

const makeNode = (type, name) => ({
  id: uid(), type,
  name: name || (type === 'folder' ? 'new-folder' : 'new-file'),
  description: '',
  children: type === 'folder' ? [] : null,
  collapsed: false,
});

// Sort: files FIRST, then folders — so files appear above subfolders
const sortChildren = (children) => {
  if (!children) return children;
  return [...children].sort((a, b) => {
    if (a.type === 'file' && b.type !== 'file') return -1;
    if (a.type !== 'file' && b.type === 'file') return 1;
    return a.name.localeCompare(b.name);
  });
};

// For export: folders first (traditional)
const sortChildrenExport = (children) => {
  if (!children) return children;
  return [...children].sort((a, b) => {
    if (a.type === 'folder' && b.type !== 'folder') return -1;
    if (a.type !== 'folder' && b.type === 'folder') return 1;
    return a.name.localeCompare(b.name);
  });
};

const sortTree = (nodes) =>
  sortChildren(nodes).map((n) => ({ ...n, children: n.children ? sortTree(n.children) : null }));

const countNodes = (nodes) => {
  let folders = 0, files = 0;
  const walk = (list) => {
    for (const n of list) {
      if (n.type === 'folder') { folders++; if (n.children) walk(n.children); } else files++;
    }
  };
  walk(nodes);
  return { folders, files };
};

const buildExport = (nodes, prefix = '') => {
  let lines = [];
  const sorted = sortChildrenExport(nodes);
  sorted.forEach((node, i) => {
    const isLast = i === sorted.length - 1;
    const connector = isLast ? '└── ' : '├── ';
    const desc = node.description ? `  — ${node.description}` : '';
    const suffix = node.type === 'folder' ? '/' : '';
    lines.push(prefix + connector + node.name + suffix + desc);
    if (node.children && node.children.length > 0) {
      const childPrefix = prefix + (isLast ? '    ' : '│   ');
      lines = lines.concat(buildExport(node.children, childPrefix));
    }
  });
  return lines;
};

// Immutable tree ops
const updateInTree = (nodes, id, patch) =>
  nodes.map((n) => {
    if (n.id === id) return { ...n, ...patch };
    if (n.children) return { ...n, children: updateInTree(n.children, id, patch) };
    return n;
  });

const deleteInTree = (nodes, id) =>
  nodes.filter((n) => n.id !== id).map((n) => {
    if (n.children) return { ...n, children: deleteInTree(n.children, id) };
    return n;
  });

const addChildInTree = (nodes, parentId, child) =>
  nodes.map((n) => {
    if (n.id === parentId) return { ...n, collapsed: false, children: [...(n.children || []), child] };
    if (n.children) return { ...n, children: addChildInTree(n.children, parentId, child) };
    return n;
  });

const findNodeById = (nodes, id) => {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) { const f = findNodeById(n.children, id); if (f) return f; }
  }
  return null;
};

const isDescendant = (nodes, ancestorId, childId) => {
  const ancestor = findNodeById(nodes, ancestorId);
  if (!ancestor || !ancestor.children) return false;
  return !!findNodeById(ancestor.children, childId);
};

const moveNode = (tree, nodeId, targetFolderId) => {
  if (isDescendant(tree, nodeId, targetFolderId)) return tree;
  const node = findNodeById(tree, nodeId);
  if (!node) return tree;
  let newTree = deleteInTree(tree, nodeId);
  newTree = addChildInTree(newTree, targetFolderId, node);
  return newTree;
};

/* ═══════ TREE NODE ═══════ */
function TreeNode({ node, onUpdate, onDelete, onAddChild, onMoveNode, focusId, linkMode, linkFrom, onLinkClick, depth }) {
  const isFolder = node.type === 'folder';
  const nameRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  useEffect(() => {
    if (focusId === node.id && nameRef.current) {
      nameRef.current.focus();
      nameRef.current.select();
    }
  }, [focusId, node.id]);

  const sorted = isFolder ? sortChildren(node.children || []) : [];

  // Drag
  const onDragStart = (e) => {
    e.dataTransfer.setData('text/plain', String(node.id));
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.closest('.tree-node').style.opacity = '0.35';
  };
  const onDragEnd = (e) => {
    const tn = e.currentTarget.closest('.tree-node');
    if (tn) tn.style.opacity = '1';
  };

  // Drop (only folders)
  const onDragOver = (e) => {
    if (!isFolder) return;
    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    setDragOver(true);
  };
  const onDragLeave = (e) => {
    e.stopPropagation();
    setDragOver(false);
  };
  const onDrop = (e) => {
    e.preventDefault(); e.stopPropagation(); setDragOver(false);
    const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (draggedId && draggedId !== node.id) onMoveNode(draggedId, node.id);
  };

  const isLinkSelected = linkFrom === node.id;
  const rowClass = [
    'tree-row',
    linkMode ? 'link-selectable' : '',
    isLinkSelected ? 'link-selected' : '',
    dragOver ? 'drag-over' : '',
  ].filter(Boolean).join(' ');

  return (
    <div className="tree-node" data-node-id={node.id}>
      <div
        className={rowClass}
        onDragOver={onDragOver}
        onDragLeave={onDragLeave}
        onDrop={onDrop}
        onClick={() => linkMode && onLinkClick(node.id)}
      >
        {isFolder ? (
          <button className={`chev-btn ${node.collapsed ? '' : 'open'}`}
            onClick={(e) => { e.stopPropagation(); onUpdate(node.id, { collapsed: !node.collapsed }); }}>
            {I.chevron}
          </button>
        ) : (
          <div className="chev-placeholder" />
        )}

        <div
          className={`node-icon-box ${isFolder ? 'folder' : 'file'}`}
          draggable
          onDragStart={onDragStart}
          onDragEnd={onDragEnd}
        >
          {isFolder ? I.folder : I.file}
        </div>

        <input
          ref={nameRef}
          className="node-name"
          value={node.name}
          placeholder={isFolder ? 'folder-name' : 'file-name'}
          spellCheck={false}
          onChange={(e) => onUpdate(node.id, { name: e.target.value })}
          onClick={(e) => e.stopPropagation()}
          size={Math.max(node.name.length, 8)}
        />

        <input
          className="node-desc"
          value={node.description}
          placeholder="description..."
          spellCheck={false}
          onChange={(e) => onUpdate(node.id, { description: e.target.value })}
          onClick={(e) => e.stopPropagation()}
        />

        <div className="row-actions">
          {isFolder && (
            <>
              <button className="icon-btn add-folder" title="Add subfolder"
                onClick={(e) => { e.stopPropagation(); onAddChild(node.id, 'folder'); }}>
                {I.folderPlus}
              </button>
              <button className="icon-btn add-file" title="Add file"
                onClick={(e) => { e.stopPropagation(); onAddChild(node.id, 'file'); }}>
                {I.filePlus}
              </button>
            </>
          )}
          <button className="icon-btn delete" title="Delete"
            onClick={(e) => { e.stopPropagation(); onDelete(node.id); }}>
            {I.trash}
          </button>
        </div>
      </div>

      {isFolder && (
        <div className={`tree-children${node.collapsed ? ' collapsed' : ''}`}>
          {sorted.map((child) => (
            <TreeNode
              key={child.id}
              node={child}
              onUpdate={onUpdate}
              onDelete={onDelete}
              onAddChild={onAddChild}
              onMoveNode={onMoveNode}
              focusId={focusId}
              linkMode={linkMode}
              linkFrom={linkFrom}
              onLinkClick={onLinkClick}
              depth={depth + 1}
            />
          ))}
          <div className="add-child-row">
            <button className="add-child-btn file-add" onClick={() => onAddChild(node.id, 'file')}>
              {I.filePlus} File
            </button>
            <button className="add-child-btn folder-add" onClick={() => onAddChild(node.id, 'folder')}>
              {I.folderPlus} Folder
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════ CONNECTION LINES (fixed SVG) ═══════ */
function ConnectionLines({ links }) {
  const [positions, setPositions] = useState([]);

  useEffect(() => {
    const compute = () => {
      const newPos = links.map((lk) => {
        const elFrom = document.querySelector(`[data-node-id="${lk.from}"] > .tree-row .node-icon-box`);
        const elTo = document.querySelector(`[data-node-id="${lk.to}"] > .tree-row .node-icon-box`);
        if (!elFrom || !elTo) return null;
        const rFrom = elFrom.getBoundingClientRect();
        const rTo = elTo.getBoundingClientRect();
        return {
          x1: rFrom.left + rFrom.width / 2,
          y1: rFrom.top + rFrom.height / 2,
          x2: rTo.left + rTo.width / 2,
          y2: rTo.top + rTo.height / 2,
        };
      }).filter(Boolean);
      setPositions(newPos);
    };
    compute();
    const interval = setInterval(compute, 200);
    window.addEventListener('scroll', compute, true);
    return () => { clearInterval(interval); window.removeEventListener('scroll', compute, true); };
  }, [links]);

  if (positions.length === 0) return null;

  return (
    <svg className="connections-svg">
      {positions.map((p, i) => {
        const dx = p.x2 - p.x1;
        const dy = p.y2 - p.y1;
        const cx = Math.abs(dx) * 0.4;
        return (
          <g key={i}>
            <path className="conn-line"
              d={`M ${p.x1} ${p.y1} C ${p.x1 + cx} ${p.y1}, ${p.x2 - cx} ${p.y2}, ${p.x2} ${p.y2}`}
            />
            <circle className="conn-dot" cx={p.x1} cy={p.y1} r="5" />
            <circle className="conn-dot" cx={p.x2} cy={p.y2} r="5" />
          </g>
        );
      })}
    </svg>
  );
}

/* ═══════ PREVIEW ═══════ */
function LivePreview({ tree }) {
  if (tree.length === 0) return <p className="preview-empty">Your structure will appear here</p>;
  const lines = buildExport(tree, '');
  return <div className="preview-tree">{lines.map((l, i) => <div key={i}>{l}</div>)}</div>;
}

/* ═══════ APP ═══════ */
function App() {
  const [tree, setTree] = useState([]);
  const [focusId, setFocusId] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [copyLabel, setCopyLabel] = useState('Copy');
  const [linkMode, setLinkMode] = useState(false);
  const [links, setLinks] = useState([]);
  const [linkFrom, setLinkFrom] = useState(null);

  const handleUpdate = useCallback((id, patch) => setTree((p) => updateInTree(p, id, patch)), []);
  const handleDelete = useCallback((id) => {
    setTree((p) => deleteInTree(p, id));
    setLinks((prev) => prev.filter((l) => l.from !== id && l.to !== id));
  }, []);
  const handleAddChild = useCallback((parentId, type) => {
    const child = makeNode(type);
    setTree((p) => addChildInTree(p, parentId, child));
    setFocusId(child.id);
  }, []);
  const handleAddRoot = useCallback(() => {
    const node = makeNode('folder');
    setTree((p) => [...p, node]);
    setFocusId(node.id);
  }, []);
  const handleMoveNode = useCallback((nodeId, targetId) => {
    setTree((p) => moveNode(p, nodeId, targetId));
  }, []);
  const handleClear = useCallback(() => {
    if (tree.length === 0) return;
    if (confirm('Clear everything?')) { setTree([]); setLinks([]); }
  }, [tree]);
  const handleCopy = useCallback(() => {
    navigator.clipboard.writeText(buildExport(tree, '').join('\n'));
    setCopyLabel('Copied!');
    setTimeout(() => setCopyLabel('Copy'), 1500);
  }, [tree]);

  // Link mode click handler
  const handleLinkClick = useCallback((id) => {
    if (!linkMode) return;
    if (linkFrom === null) {
      setLinkFrom(id);
    } else {
      if (linkFrom !== id) {
        const from = linkFrom;
        setLinks((prev) => {
          const exists = prev.some((l) =>
            (l.from === from && l.to === id) || (l.from === id && l.to === from)
          );
          if (exists) {
            return prev.filter((l) =>
              !((l.from === from && l.to === id) || (l.from === id && l.to === from))
            );
          }
          return [...prev, { from, to: id }];
        });
      }
      setLinkFrom(null);
    }
  }, [linkMode, linkFrom]);

  // Escape to cancel link
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') { setLinkFrom(null); if (linkMode) setLinkMode(false); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [linkMode]);

  const { folders, files } = countNodes(tree);
  const sorted = sortTree(tree);

  return (
    <div className="app">
      {/* Connection lines rendered on top of everything */}
      <ConnectionLines links={links} />

      {/* Sidebar */}
      <div className="sidebar">
        <div className="logo">
          <div className="logo-icon">{I.layers}</div>
          <h1>Structure Planner</h1>
        </div>

        <div>
          <div className="sidebar-label">Add to Root</div>
          <div className="add-buttons" style={{ marginTop: '0.5rem' }}>
            <button className="add-btn folder-btn" onClick={handleAddRoot}>
              <div className="btn-icon">{I.folderPlus}</div>
              New Folder
            </button>
          </div>
        </div>

        <div className="sidebar-divider" />

        <div className="sidebar-label">Tools</div>
        <button
          className={`link-toggle${linkMode ? (linkFrom !== null ? ' waiting' : ' active') : ''}`}
          onClick={() => { setLinkMode((p) => !p); setLinkFrom(null); }}
        >
          {I.link}
          {linkMode
            ? (linkFrom !== null ? 'Now click target...' : 'Link Mode ON — click source')
            : 'Link Mode'}
        </button>

        {links.length > 0 && (
          <button className="action-btn danger" onClick={() => setLinks([])}>
            {I.x} Clear All Links ({links.length})
          </button>
        )}

        <div className="sidebar-divider" />

        <div className="sidebar-label">Actions</div>
        <button className="action-btn" onClick={() => tree.length && setShowExport(true)}>
          {I.exportIcon} Export
        </button>
        <button className="action-btn danger" onClick={handleClear}>
          {I.eraser} Clear All
        </button>

        <div className="sidebar-footer">Files appear above subfolders</div>
      </div>

      {/* Main tree */}
      <div className="main">
        <div className="toolbar-bar">
          <div className="stats">
            <span><span className="stat-dot folder" />{folders} folder{folders !== 1 ? 's' : ''}</span>
            <span><span className="stat-dot file" />{files} file{files !== 1 ? 's' : ''}</span>
            {links.length > 0 && <span>{links.length} link{links.length !== 1 ? 's' : ''}</span>}
          </div>
          <div className="hint">
            {linkMode
              ? (linkFrom !== null ? 'Click another item to complete the link (Esc to cancel)' : 'Click an item to start linking')
              : 'Drag icons to move between folders'}
          </div>
        </div>

        <div className="canvas-area">
          {sorted.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">{I.layers}</div>
              <p>Plan your project's file structure.<br />Add a root folder to get started.</p>
              <button className="empty-cta" onClick={handleAddRoot}>{I.plus} Add Root Folder</button>
            </div>
          ) : (
            sorted.map((node) => (
              <TreeNode
                key={node.id} node={node}
                onUpdate={handleUpdate} onDelete={handleDelete}
                onAddChild={handleAddChild} onMoveNode={handleMoveNode}
                focusId={focusId} linkMode={linkMode} linkFrom={linkFrom}
                onLinkClick={handleLinkClick} depth={0}
              />
            ))
          )}
        </div>
      </div>

      {/* Preview */}
      <div className="preview-panel">
        <h3>Live Preview</h3>
        <LivePreview tree={sorted} />
      </div>

      {/* Export modal */}
      {showExport && (
        <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && setShowExport(false)}>
          <div className="modal-box">
            <h2>Exported Structure</h2>
            <pre>{buildExport(tree, '').join('\n')}</pre>
            <div className="modal-footer">
              <button onClick={() => setShowExport(false)}>Close</button>
              <button className="btn-primary" onClick={handleCopy}>{copyLabel}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
